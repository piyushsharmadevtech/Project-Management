<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flowboard | CodSoft</title><link rel="stylesheet" href="style.css"><script defer src="script.js"></script></head><body><nav><b>flow<span>board.</span></b><span>● Workspace</span></nav><section class="hero"><small>PROJECT WORKSPACE</small><h1>Make progress<br><em>visible.</em></h1><p>Organize tasks, move work forward and keep your focus.</p><button id="new">+ Add task</button></section><main class="board"><section><h2>To do <small id="n0"></small><div id="todo"></div></section><section><h2>In progress <small id="n1"></small><div id="doing"></div></section><section><h2>Done <small id="n2"></small><div id="done"></div></section></main><dialog id="dlg"><form id="form"><h2>New task</h2><input id="title" placeholder="Task title" required><textarea id="desc" placeholder="Description"></textarea><select id="status"><option>To do</option><option>In progress</option><option>Done</option></select><button>Save task</button><button type="button" id="cancel">Cancel</button></form></dialog><footer style="padding:25px 10%;color:#9ba8bc;font-size:12px">CodSoft internship project demo · Flowboard</footer></body></html>
